<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linear Combination and Span</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e2a3f;--ink:#e8f1f7;--dim:#8fb0c4;--a:#ff7a59;--b:#5ce1e6;--w:#ffd23f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}
html,body{margin:0;background:#07161f;color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}
#stage{position:relative;width:100%;max-width:1100px;aspect-ratio:16/9;background:var(--bg);border-radius:10px;overflow:hidden;container-type:inline-size}
canvas{position:absolute;inset:0;width:100%;height:100%}
#eq{position:absolute;left:3cqw;top:2.6cqw;font-size:3.4cqw;font-weight:700;letter-spacing:-.01em}
#sub{position:absolute;left:3cqw;top:7.4cqw;font-size:1.8cqw;color:var(--dim)}
#cap{position:absolute;left:0;right:0;bottom:0;padding:2cqw 4cqw 2.4cqw;font-size:2.1cqw;line-height:1.4;background:linear-gradient(transparent,rgba(7,22,31,.92) 40%);text-align:center;min-height:11cqw;display:flex;align-items:flex-end;justify-content:center}
#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqw;background:var(--bg);z-index:5}
#start h1{font-size:6cqw;margin:0;letter-spacing:-.02em;text-align:center}
#start p{margin:0;color:var(--dim);font-size:2cqw}
button{font:inherit;color:var(--ink);background:#17405d;border:1px solid #2c6a93;border-radius:6px;padding:8px 14px;cursor:pointer}
button:hover,button:focus-visible{background:#1f5276;outline:2px solid var(--b);outline-offset:2px}
#start button{font-size:2.2cqw;padding:1.2cqw 3cqw;background:var(--a);border-color:var(--a);color:#07161f;font-weight:700}
#bar{width:100%;max-width:1100px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#prog{flex:1;min-width:120px;height:6px;background:#17405d;border-radius:3px;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:var(--b)}
label{color:var(--dim);font-size:14px;display:flex;gap:6px;align-items:center}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body>
<div id="stage">
<canvas id="cv" width="960" height="540"></canvas>
<div id="eq"></div><div id="sub"></div><div id="cap"></div>
<div id="start"><h1>Linear Combination and Span</h1><p>Full walkthrough, 5 minutes 25 seconds</p><button id="go">Play</button></div>
</div>
<div id="bar">
<button id="pp">Pause</button><button id="prev">Prev</button><button id="next">Next</button><button id="rs">Restart</button>
<label><input type="checkbox" id="voice"> Read captions aloud</label>
<div id="prog"><i></i></div><span id="tm" style="color:var(--dim);font-size:14px;min-width:90px">0:00 / 5:25</span>
</div>
<script>
const cv=document.getElementById('cv'),c=cv.getContext('2d'),W=960,H=540;
const COL={u:'#ff7a59',v:'#5ce1e6',w:'#ffd23f',g:'rgba(143,176,196,.18)',ax:'rgba(232,241,247,.55)',tx:'#e8f1f7'};
let V={ox:140,oy:410,s:30};
const X=x=>V.ox+x*V.s,Y=y=>V.oy-y*V.s;
const ez=t=>t<0?0:t>1?1:t*t*(3-2*t);
const seg=(p,a,b)=>ez((p-a)/(b-a));
function grid(){
  c.lineWidth=1;c.strokeStyle=COL.g;c.beginPath();
  const x0=Math.floor(-V.ox/V.s)-1,x1=Math.ceil((W-V.ox)/V.s)+1,y0=Math.floor(-(H-V.oy)/V.s)-1,y1=Math.ceil(V.oy/V.s)+1;
  for(let i=x0;i<=x1;i++){c.moveTo(X(i),0);c.lineTo(X(i),H)}
  for(let j=y0;j<=y1;j++){c.moveTo(0,Y(j));c.lineTo(W,Y(j))}
  c.stroke();c.strokeStyle=COL.ax;c.lineWidth=1.5;c.beginPath();
  c.moveTo(0,Y(0));c.lineTo(W,Y(0));c.moveTo(X(0),0);c.lineTo(X(0),H);c.stroke();
}
function arrow(x0,y0,x1,y1,col,label,k=1,lw=4){
  if(k<=0)return;
  const ex=x0+(x1-x0)*k,ey=y0+(y1-y0)*k;
  c.strokeStyle=col;c.fillStyle=col;c.lineWidth=lw;c.lineCap='round';
  c.beginPath();c.moveTo(X(x0),Y(y0));c.lineTo(X(ex),Y(ey));c.stroke();
  const a=Math.atan2(-(ey-y0),ex-x0),h=14;
  c.beginPath();c.moveTo(X(ex),Y(ey));
  c.lineTo(X(ex)-h*Math.cos(a-.4),Y(ey)-h*Math.sin(a-.4));
  c.lineTo(X(ex)-h*Math.cos(a+.4),Y(ey)-h*Math.sin(a+.4));c.fill();
  if(label&&k>.6){c.font='700 22px Bricolage Grotesque,system-ui,sans-serif';c.fillStyle=col;c.fillText(label,X(ex)+10,Y(ey)-8)}
}
function dot(x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(X(x),Y(y),r,0,7);c.fill()}
function txt(s,x,y,size,col,al='left'){c.font=`700 ${size}px Bricolage Grotesque,system-ui,sans-serif`;c.fillStyle=col;c.textAlign=al;c.fillText(s,x,y);c.textAlign='left'}
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const PTS=[];for(let i=0;i<520;i++)PTS.push([(rnd()-.5)*8,(rnd()-.5)*8]);


const L=(x,y,k,lw=5)=>{c.strokeStyle='rgba(255,210,63,.85)';c.lineWidth=lw;c.beginPath();c.moveTo(X(-x*k),Y(-y*k));c.lineTo(X(x*k),Y(y*k));c.stroke()};
const S=[
{eq:'Linear Combination and Span',sub:'Two core ideas in linear algebra',
 cap:['Hello Sir or Ma’am.','Today, I am going to explain two important concepts in Linear Algebra, namely Linear Combination and Span.','These concepts are fundamental because they help us understand how vectors can be combined, how new vectors can be generated, and how vectors are related to one another.','Let’s start with Linear Combination.'],
 draw(p){V={ox:480,oy:300,s:36};grid();arrow(0,0,3*seg(p,.1,.6),4*seg(p,.1,.6),COL.u,'',1);arrow(0,0,-4*seg(p,.3,.8),2*seg(p,.3,.8),COL.v,'',1)}},
{eq:'w = a·u + b·v',sub:'1. Linear combination: scale each vector, then add',
 cap:['A linear combination is basically a way of combining two or more vectors by multiplying each vector by a scalar and then adding the results.','In simple terms, we take vectors, multiply them by some constants, and add them together to obtain a new vector.','Mathematically, suppose we have two vectors, u and v. A linear combination of these vectors can be represented as w equals a u plus b v.','Here, a and b are called scalar coefficients, while u and v are the given vectors. The resulting vector w is obtained by multiplying each vector by its respective coefficient and then adding them.'],
 draw(p){V={ox:480,oy:430,s:40};grid();arrow(0,0,2,3,COL.u,'u',seg(p,.2,.5));arrow(0,0,1,4,COL.v,'v',seg(p,.4,.7));
  if(p>.75){arrow(0,0,2*1.5,3*1.5,'rgba(255,122,89,.5)','a·u',1,3);arrow(0,0,1*2,4*2,'rgba(92,225,230,.5)','b·v',1,3)}}},
{eq:'w = 2u + 3v',sub:'Step 1: multiply each vector by its scalar',
 cap:['Let’s understand this with an example.','Suppose we have two vectors: u equals (2, 3), and v equals (1, 4).','Now, let’s consider the following linear combination: w equals 2u plus 3v.','First, we multiply vector u by 2. This gives us 2u equals (4, 6).','Next, we multiply vector v by 3. This gives us 3v equals (3, 12).'],
 draw(p){V={ox:120,oy:430,s:20};grid();arrow(0,0,2,3,COL.u,'u = (2, 3)',seg(p,.1,.3));arrow(0,0,1,4,COL.v,'v = (1, 4)',seg(p,.25,.4));
  arrow(0,0,4,6,COL.u,'2u = (4, 6)',seg(p,.55,.72));arrow(0,0,3,12,COL.v,'3v = (3, 12)',seg(p,.82,.98))}},
{eq:'w = (4+3, 6+12) = (7, 18)',sub:'Step 2: add component-wise',
 cap:['Now, we add these two vectors component-wise.','So, w becomes (4 plus 3, 6 plus 12).','Therefore, our final answer is w equals (7, 18).','Hence, (7, 18) is a linear combination of the vectors (2, 3) and (1, 4).'],
 draw(p){V={ox:120,oy:430,s:20};grid();arrow(0,0,4,6,COL.u,'2u',1);arrow(4,6,7,18,COL.v,'3v',seg(p,.1,.45));
  arrow(0,0,7,18,COL.w,'w = (7, 18)',seg(p,.5,.85),5);if(p>.85)dot(7,18,7,COL.w)}},
{eq:'Coefficients can be negative or zero',sub:'Example: w = −u + 2v = (0, 5)',
 cap:['The important thing to remember is that the scalar coefficients can be positive, negative, or even zero.','Linear combinations are useful in solving systems of linear equations, representing vectors, and understanding vector spaces.','Now that we understand Linear Combination, let’s move on to the second concept, which is Span.'],
 draw(p){V={ox:480,oy:360,s:30};grid();arrow(0,0,2,3,'rgba(255,122,89,.3)','',1,3);arrow(0,0,1,4,'rgba(92,225,230,.3)','',1,3);
  arrow(0,0,-2,-3,COL.u,'−u',seg(p,.1,.4));arrow(-2,-3,0,5,COL.v,'2v',seg(p,.4,.7));arrow(0,0,0,5,COL.w,'w = (0, 5)',seg(p,.7,.95),5)}},
{eq:'Span(u, v) = { a·u + b·v | a, b ∈ ℝ }',sub:'2. Span: every vector you can build',
 cap:['Span is closely related to Linear Combination.','In fact, we can think of Span as the collection of all possible linear combinations of a given set of vectors.','In simple words, Span tells us all the possible vectors that we can generate using the given vectors by changing their scalar coefficients.','Mathematically, if we have two vectors u and v, their span is the set of all a u plus b v, where a and b belong to the real numbers.','This means that a and b can take any real value, and every resulting vector belongs to the span.'],
 draw(p){V={ox:480,oy:300,s:26};grid();const n=Math.floor(PTS.length*seg(p,.1,.95));
  for(let i=0;i<n;i++){const [a,b]=PTS[i];dot(a*2+b*1,a*3+b*4,3.2,'rgba(255,210,63,.8)')}
  arrow(0,0,2,3,COL.u,'u',1);arrow(0,0,1,4,COL.v,'v',1)}},
{eq:'Span of one non-zero vector',sub:'A straight line through the origin',
 cap:['Let’s understand this geometrically.','Consider a vector u in a two-dimensional plane.','If we take all possible scalar multiples of this vector, we can generate vectors in both the positive and negative directions along the same line.','Therefore, the span of one non-zero vector in two-dimensional space is a straight line passing through the origin.'],
 draw(p){V={ox:480,oy:300,s:36};grid();L(3,4.5,seg(p,.3,.95)*2.2);arrow(0,0,2,3,COL.u,'u',1)}},
{eq:'Non-parallel vs. parallel',sub:'The span depends on the relationship between the vectors',
 cap:['Now, suppose we have two vectors that are not parallel to each other.','By taking different linear combinations of these two vectors, we can generate every possible vector in the two-dimensional plane.','Therefore, their span becomes the entire two-dimensional plane.','However, if the two vectors are parallel, they cannot generate the entire plane. Their span remains a straight line.','This gives us an important observation: the span depends on the relationship between the given vectors.'],
 draw(p){V={ox:480,oy:300,s:30};
  if(p<.55){const k=seg(p,.15,.45);c.fillStyle=`rgba(92,225,230,${.22*k})`;c.fillRect(0,0,W,H);grid();
   arrow(0,0,2,3,COL.u,'u',1);arrow(0,0,1,4,COL.v,'v',1);if(k>.5)txt('Span = the whole plane',480,200,30,COL.w,'center')}
  else{grid();L(2,3,seg(p,.6,.8)*5);arrow(0,0,2,3,COL.u,'u = (2, 3)',1);arrow(0,0,4,6,COL.v,'v = (4, 6)',1);if(p>.8)txt('Span = a line',480,200,30,COL.w,'center')}}},
{eq:'Span((1, 0), (0, 1)) = ℝ²',sub:'a(1, 0) + b(0, 1) = (a, b)',
 cap:['Let’s take a numerical example.','Suppose we have two vectors: u equals (1, 0), and v equals (0, 1).','Their span can be written as a(1, 0) plus b(0, 1). After multiplying the vectors, we get (a, b).','Since a and b can be any real numbers, we can generate any point in the two-dimensional plane.','For example, if we choose a equals 3 and b equals 5, we get the vector (3, 5). Similarly, we can generate (1, 2), (7, 9), or any other vector in R2.','Therefore, the span of these two vectors is the entire R2 plane.'],
 draw(p){V={ox:220,oy:440,s:38};grid();arrow(0,0,1,0,COL.u,'(1, 0)',1);arrow(0,0,0,1,COL.v,'(0, 1)',1);
  const k=seg(p,.35,.6);arrow(0,0,3*k,0,COL.u,'',1,2);arrow(3*k,0,3*k,5*k,COL.v,'',1,2);arrow(0,0,3*k,5*k,COL.w,k>.95?'(3, 5)':'',1,5);
  if(p>.7){[[1,2],[7,9],[5,3]].forEach(([x,y])=>{dot(x,y,6,COL.w);txt(`(${x}, ${y})`,X(x)+10,Y(y)-8,18,COL.tx)})}
  if(p>.9){c.fillStyle='rgba(92,225,230,.1)';c.fillRect(0,0,W,H)}}},
{eq:'Process vs. collection',sub:'3. Difference between linear combination and span',
 cap:['Before concluding, let’s understand the difference between these two concepts.','Linear Combination refers to the process of multiplying given vectors by scalar coefficients and adding them to obtain a vector.','On the other hand, Span refers to the set of all possible vectors that can be obtained through every possible linear combination of the given vectors.','So, we can say that linear combination is the process, whereas span is the collection of all possible results of that process.'],
 draw(p){V={ox:480,oy:300,s:36};
  const box=(x,col,h,t1,t2,k)=>{c.globalAlpha=k;c.strokeStyle=col;c.lineWidth=3;c.strokeRect(x,170,380,190);txt(h,x+190,225,32,col,'center');txt(t1,x+190,280,22,COL.tx,'center');txt(t2,x+190,315,22,COL.tx,'center');c.globalAlpha=1};
  box(60,COL.u,'Linear combination','The process: scale','the vectors, then add',seg(p,.1,.3));
  box(520,COL.w,'Span','The collection of all','results of that process',seg(p,.55,.75))}},
{eq:'Conclusion',sub:'Vector spaces, linear independence, basis, dimension',
 cap:['To conclude, Linear Combination and Span are two fundamental concepts in Linear Algebra.','Linear Combination helps us construct new vectors using existing vectors and scalar coefficients.','Span helps us identify the complete set of vectors that can be generated from a given collection of vectors.','These concepts form the foundation for understanding vector spaces, linear independence, basis, and dimension, which are important topics in Linear Algebra.','Thank you, everyone.'],
 draw(p){V={ox:480,oy:300,s:36};grid();
  ['Vector spaces','Linear independence','Basis','Dimension'].forEach((t,i)=>{c.globalAlpha=seg(p,.45+i*.1,.6+i*.1);txt(t,480,215+i*50,30,[COL.u,COL.v,COL.w,COL.tx][i],'center');c.globalAlpha=1})}}
];
const WPS=2.35,PAUSE=.8;
const TARGET=325,LAST=3,ST=[0,23,64,93,113,133,169.5,191.4,221,261,292,325];
S.forEach((sc,i)=>{
  const isLast=i===S.length-1,w=sc.cap.map(t=>t.split(/\s+/).length/WPS+PAUSE),wl=isLast?w.slice(0,-1):w;
  const k=(ST[i+1]-ST[i]-(isLast?LAST:0))/wl.reduce((a,b)=>a+b,0);
  sc.d=wl.map(x=>x*k);if(isLast)sc.d.push(LAST);
  sc.dur=sc.d.reduce((a,b)=>a+b,0);
});
const TOTAL=TARGET;
const fmt=s=>{s=Math.min(TARGET,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};

const eq=document.getElementById('eq'),sub=document.getElementById('sub'),cap=document.getElementById('cap'),bar=document.querySelector('#prog i');
let idx=0,si=0,sacc=0,scAcc=0,playing=false,spDone=true,last=0;
const voice=document.getElementById('voice'),pp=document.getElementById('pp');
function speak(s){
  speechSynthesis.cancel();
  if(!voice.checked){spDone=true;return}
  spDone=false;const u=new SpeechSynthesisUtterance(s);u.rate=1;u.onend=u.onerror=()=>{spDone=true};speechSynthesis.speak(u);
}
function setSentence(i){si=i;sacc=0;cap.textContent=S[idx].cap[si];speak(S[idx].cap[si])}
function setScene(i){
  idx=Math.max(0,Math.min(S.length-1,i));scAcc=0;
  eq.textContent=S[idx].eq;sub.textContent=S[idx].sub;setSentence(0);
}
function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(playing){
    sacc+=dt;scAcc+=dt;const sc=S[idx];
    if(sacc>=sc.d[si]&&spDone){
      if(si<sc.cap.length-1)setSentence(si+1);
      else if(idx<S.length-1)setScene(idx+1);
      else{playing=false;pp.textContent='Replay'}
    }
  }
  const sc=S[idx],before=sc.d.slice(0,si).reduce((a,b)=>a+b,0),sp=Math.min(1,(before+Math.min(sacc,sc.d[si]))/sc.dur);
  c.clearRect(0,0,W,H);c.fillStyle='#0e2a3f';c.fillRect(0,0,W,H);sc.draw(sp);
  const done=S.slice(0,idx).reduce((a,s)=>a+s.dur,0)+before+Math.min(sacc,sc.d[si]);
  bar.style.width=(100*done/TOTAL)+'%';document.getElementById('tm').textContent=fmt(done)+' / '+fmt(TOTAL);
  requestAnimationFrame(frame);
}
document.getElementById('go').onclick=()=>{document.getElementById('start').style.display='none';playing=true;pp.textContent='Pause';setScene(0)};
pp.onclick=()=>{
  if(pp.textContent==='Replay'){setScene(0);playing=true;pp.textContent='Pause';return}
  playing=!playing;pp.textContent=playing?'Pause':'Play';
  if(playing)speechSynthesis.resume();else speechSynthesis.pause();
};
document.getElementById('prev').onclick=()=>{setScene(idx-1);playing=true;pp.textContent='Pause'};
document.getElementById('next').onclick=()=>{setScene(idx+1);playing=true;pp.textContent='Pause'};
document.getElementById('rs').onclick=()=>{setScene(0);playing=true;pp.textContent='Pause'};
voice.onchange=()=>speak(S[idx].cap[si]);
setScene(0);playing=false;requestAnimationFrame(t=>{last=t;frame(t)});
console.log('total seconds',TOTAL);
</script></body></html>
